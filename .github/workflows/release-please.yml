name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # A job-level `if` cannot read another job's `steps`; expose it as an output.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          package-name: musubi-harness

  # The same suite PRs run; a release commit that fails it does not publish.
  test:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ci.yml

  publish:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please, test]
    runs-on: ubuntu-latest
    environment: pypi
    # A job-level block sets every unlisted permission to none, so checkout
    # needs contents: read spelled out.
    # Token upload for now (Eric's go, 2026-09-26): PYPI_API_TOKEN is a secret
    # of the `pypi` environment, which only `main` may deploy to. When a PyPI
    # Trusted Publisher exists for this repo/workflow/environment, restore
    # `id-token: write`, drop `password`, turn attestations back on, and
    # delete the secret.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PEP 740 attestations need Trusted Publishing; off while on a token.
          attestations: false
